<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JWT Authentication + RBAC</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f3f6fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(920px, calc(100% - 32px)); margin: 48px auto; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.3rem); }
    header p { margin: 0; color: #5b6475; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
    section { padding: 22px; background: white; border: 1px solid #e1e7f0; border-radius: 14px; box-shadow: 0 5px 20px #1720330a; }
    h2 { margin: 0 0 16px; font-size: 1.15rem; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; font-size: .9rem; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd4e1; border-radius: 8px; font: inherit; }
    input:focus, select:focus { outline: 3px solid #bfdbfe; border-color: #2563eb; }
    .buttons { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }
    button { border: 0; border-radius: 8px; padding: 10px 14px; color: white; background: #1d4ed8; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #1e40af; }
    button.secondary { color: #253047; background: #e9eef6; }
    button.secondary:hover { background: #dce4f0; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status { min-height: 24px; margin: 12px 0 0; color: #475569; font-size: .92rem; }
    .token { overflow-wrap: anywhere; color: #475569; font: .78rem/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
    pre { min-height: 86px; max-height: 260px; overflow: auto; margin: 14px 0 0; padding: 14px; border-radius: 8px; background: #111827; color: #e5e7eb; white-space: pre-wrap; overflow-wrap: anywhere; }
    .hint { margin: 10px 0 0; color: #64748b; font-size: .86rem; }
    @media (max-width: 560px) { main { margin: 28px auto; } section { padding: 18px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>JWT Authentication + RBAC</h1>
      <p>Sign in with a demo account, then try the public, authenticated, and admin-only endpoints.</p>
    </header>

    <div class="grid">
      <section aria-labelledby="login-heading">
        <h2 id="login-heading">Sign in</h2>
        <form id="login-form">
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" value="user" required>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" value="user123" required>
          <div class="buttons">
            <button type="submit">Log in</button>
            <button class="secondary" type="button" id="logout-button">Log out</button>
          </div>
        </form>
        <p class="hint">Demo USER: user / user123<br>Demo ADMIN: admin / admin123</p>
        <p id="login-status" class="status" role="status" aria-live="polite">Not signed in.</p>
        <p id="token-display" class="token"></p>
      </section>

      <section aria-labelledby="endpoints-heading">
        <h2 id="endpoints-heading">Try an endpoint</h2>
        <label for="endpoint">Endpoint</label>
        <select id="endpoint">
          <option value="/api/public">GET /api/public — public</option>
          <option value="/api/profile">GET /api/profile — authenticated</option>
          <option value="/api/admin">GET /api/admin — ADMIN role</option>
          <option value="/api/admin/data" data-method="DELETE">DELETE /api/admin/data — ADMIN role</option>
        </select>
        <div class="buttons">
          <button type="button" id="call-button">Call endpoint</button>
        </div>
        <p id="request-status" class="status" role="status" aria-live="polite">Choose an endpoint and call it.</p>
        <pre id="response" aria-label="Endpoint response">Response will appear here.</pre>
      </section>
    </div>
  </main>

  <script>
    const loginForm = document.querySelector("#login-form");
    const loginStatus = document.querySelector("#login-status");
    const tokenDisplay = document.querySelector("#token-display");
    const requestStatus = document.querySelector("#request-status");
    const responseOutput = document.querySelector("#response");
    const callButton = document.querySelector("#call-button");
    const endpointSelect = document.querySelector("#endpoint");
    let token = "";

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginStatus.textContent = "Signing in…";
      token = "";
      tokenDisplay.textContent = "";
      try {
        const result = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: loginForm.elements.username.value,
            password: loginForm.elements.password.value
          })
        });
        const body = await result.json().catch(() => null);
        if (!result.ok) {
          loginStatus.textContent = `Sign-in failed (${result.status}): ${typeof body === "string" ? body : "Check the username and password."}`;
          return;
        }
        token = body.token;
        loginStatus.textContent = `Signed in as ${body.username} (${body.role}).`;
        tokenDisplay.textContent = `JWT: ${token}`;
      } catch (error) {
        loginStatus.textContent = `Could not reach the server: ${error.message}`;
      }
    });

    document.querySelector("#logout-button").addEventListener("click", () => {
      token = "";
      tokenDisplay.textContent = "";
      loginStatus.textContent = "Logged out.";
    });

    callButton.addEventListener("click", async () => {
      const option = endpointSelect.selectedOptions[0];
      const method = option.dataset.method || "GET";
      const endpoint = endpointSelect.value;
      requestStatus.textContent = "Request in progress…";
      responseOutput.textContent = "";
      callButton.disabled = true;
      try {
        const headers = {};
        if (token) headers.Authorization = `Bearer ${token}`;
        const result = await fetch(endpoint, { method, headers });
        const body = await result.text();
        requestStatus.textContent = `${method} ${endpoint} — HTTP ${result.status}${result.ok ? " (success)" : " (request denied or failed)"}`;
        responseOutput.textContent = body || "(empty response)";
      } catch (error) {
        requestStatus.textContent = `Could not reach the server: ${error.message}`;
      } finally {
        callButton.disabled = false;
      }
    });
  </script>
</body>
</html>
